apiVersion: v1
kind: Service

metadata:
  name: {{ include "my-web-app.fullname" . }}

spec:
  type: {{ .Values.service.type }}

  selector:
    {{- include "my-web-app.selectorLabels" . | nindent 4 }}

  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP