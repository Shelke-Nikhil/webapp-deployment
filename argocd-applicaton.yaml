apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: my-web-app
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/shelke-nikhil/webapp-deployment.git
    targetRevision: master
    path: .

  destination:
    server: https://kubernetes.default.svc
    namespace: webapp

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true